<!doctype html>
<!-- 标点查看页（scripts/landmark-view.mjs 生成数据，复制到 results/human/landmarks/index.html） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>标点查看</title>
<style>
  body { font: 13px/1.5 -apple-system, sans-serif; margin: 0; background: #f4f4f4; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #ddd; padding: 8px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .layout { display: flex; align-items: flex-start; }
  main { flex: 1; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  aside { position: sticky; top: 49px; width: 320px; max-height: calc(100vh - 49px); overflow: auto; box-sizing: border-box; padding: 12px 16px; background: #fff; border-left: 1px solid #ddd; font-size: 12px; }
  aside h4 { margin: 4px 0 6px; font-size: 13px; }
  aside dl { margin: 0 0 12px; }
  aside dt { font-family: ui-monospace, monospace; font-weight: 600; margin-top: 6px; }
  aside dd { margin: 0; color: #444; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; }
  .card table { border-collapse: collapse; margin-top: 6px; font-size: 12px; }
  .card td { padding: 1px 8px 1px 0; }
  .bad { color: #c00; font-weight: 600; }
  svg { display: block; background: #fff; cursor: zoom-in; }
  svg.zoomed { cursor: zoom-out; }
  text { paint-order: stroke; stroke: #fff; stroke-width: 3px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <label>标点结果 <select id="src"></select></label>
  <label>看 <select id="view"><option value="cases">riv（有真值）</option><option value="masters">主图（无真值）</option></select></label>
  <label>第几次 <select id="run"><option value="">全部</option><option value="0">第 1 次</option><option value="1">第 2 次</option><option value="2">第 3 次</option><option value="none">不看（只看真值）</option></select></label>
  <label><input type="checkbox" id="labels"> 显示点名</label>
  <label>只看点 <select id="only"><option value="">全部</option></select></label>
  <span class="legend">
    <span><i class="dot" style="background:#0a0"></i>代码真值</span>
    <span><i class="dot" style="background:#e33"></i>第 1 次</span>
    <span><i class="dot" style="background:#26f"></i>第 2 次</span>
    <span><i class="dot" style="background:#f90"></i>第 3 次</span>
    点击图片放大到眼睛和嘴附近；误差 = 和真值距离 ÷ 两眼外沿宽，红色 &gt; 3%
  </span>
</header>
<div class="layout">
<main id="main"></main>
<aside>
  <h4><i class="dot" style="background:#0a0"></i> 代码真值（只在 riv 上有）</h4>
  <p style="margin:0 0 4px;color:#666">同一组参数下 riv 只显示一个部件（其余清空）渲染，从该部件的像素直接取点；被眼皮、刘海挡住的部分也算在内。</p>
  <dl id="truthDefs"></dl>
  <h4>模型标的点（红 / 蓝 / 橙）</h4>
  <p style="margin:0 0 4px;color:#666">v20 标点用的那组点（POINTS_WHITE），含义取自 scripts/landmarks.mjs，"左" 指画面左侧。带 ★ 的有真值可比。</p>
  <dl id="pointDefs"></dl>
</aside>
</div>
<script>
const RUN_COLORS = ['#e33', '#26f', '#f90'];
// 真值怎么算（page/main.js 的 landmarkTruth）；点名和模型标点相同
const TRUTH_DEFS = {
  eye_l: '左眼白开口（眼白图层里亮且近无色的像素，不含睫毛、眼线、眼眶）外框的中心', eye_r: '右眼，同上',
  eye_l_outer: '左眼白开口最左端（该列浅色像素的中点）', eye_l_inner: '左眼白开口最右端',
  eye_l_top: '左眼白开口正中那一列的上沿', eye_l_bottom: '左眼白开口正中那一列的下沿',
  iris_l_center: '左瞳孔图层（虹膜圆盘）的重心', iris_r_center: '右瞳孔图层的重心（模型这组点里没有，不比）',
  iris_l_left: '左虹膜中心那一行的最左端', iris_l_right: '左虹膜中心那一行的最右端',
  mouth_l: '上下嘴唇合起来的最左端；高度取嘴的上下中点', mouth_r: '最右端；高度同上',
  chin: '头部图层最低那一行的中点',
};
const SHOW_W = 360;
const ok = (p) => Array.isArray(p) && p.length === 2 && p.every(Number.isFinite);
const $ = (id) => document.getElementById(id);
let data;

function svgEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}

// 默认看整图；点一下放大到脸部（以真值或模型点的范围为框）
function faceBox(item, runs) {
  // riv 用真值的脸部点定框；主图没真值，用模型的脸部点（都不含肩和头顶，免得框太大）
  const FACE = ['eye_l', 'eye_r', 'iris_l_center', 'mouth_l', 'mouth_r', 'chin', 'brow_l', 'brow_r', 'nose'];
  const pts = (item.truth ? FACE.map((k) => item.truth[k]) : runs.flatMap((r) => FACE.map((k) => r?.[k]))).filter(ok);
  if (!pts.length) return null;
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max(x1 - x0, y1 - y0) * 0.15 + 20;
  return [x0 - pad, y0 - pad, x1 - x0 + pad * 2, y1 - y0 + pad * 2];
}

function card(item, src, withTruth) {
  const runs = item.points[src] ?? [];
  const only = $('only').value, showLabels = $('labels').checked, run = $('run').value;
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<h3>${withTruth ? `#${item.no} · ${item.p8} · ${item.method}` : `主图 · ${item.p8}`}${runs.length ? '' : ' · <span class="bad">这份结果没有这张图</span>'}</h3>`;
  const full = `0 0 ${item.W} ${item.H}`, box = faceBox(item, runs);
  const svg = svgEl('svg', { viewBox: full, width: SHOW_W, height: SHOW_W * item.H / item.W });
  svg.appendChild(svgEl('image', { href: item.img, x: 0, y: 0, width: item.W, height: item.H }));
  const r = item.W / 160;
  const g = svgEl('g', {});
  const errs = {};
  runs.forEach((pts, i) => {
    if (!pts || run === 'none' || (run !== '' && i !== Number(run))) return;
    for (const [name, p] of Object.entries(pts)) {
      if (!ok(p) || (only && name !== only)) continue;
      const t = withTruth && item.truth?.[name];
      if (t) {
        g.appendChild(svgEl('line', { x1: t[0], y1: t[1], x2: p[0], y2: p[1], stroke: RUN_COLORS[i], 'stroke-width': r / 3, 'data-w': r / 3 }));
        (errs[name] ??= [])[i] = (Math.hypot(p[0] - t[0], p[1] - t[1]) / item.faceWidthPx * 100);  // 按第几次放，表格列对齐
      }
      g.appendChild(svgEl('circle', { cx: p[0], cy: p[1], r, 'data-r': r, fill: RUN_COLORS[i], 'fill-opacity': 0.8 }));
      if (showLabels && (run === '' ? i === 0 : true)) g.appendChild(svgEl('text', { x: p[0] + r * 1.5, y: p[1] - r, fill: '#333' }, name));
    }
  });
  if (withTruth && item.truth) {
    for (const [name, t] of Object.entries(item.truth)) {
      if (only && name !== only) continue;
      g.appendChild(svgEl('circle', { cx: t[0], cy: t[1], r: r * 1.2, 'data-r': r * 1.2, fill: 'none', stroke: '#0a0', 'stroke-width': r / 2, 'data-w': r / 2 }));
      if (showLabels) g.appendChild(svgEl('text', { x: t[0] + r * 1.5, y: t[1] + r * 3, fill: '#070' }, name));
    }
  }
  svg.appendChild(g);
  svg.addEventListener('click', () => {
    if (!box) return;
    const zoomed = svg.classList.toggle('zoomed');
    svg.setAttribute('viewBox', zoomed ? box.join(' ') : full);
    svg.setAttribute('height', zoomed ? SHOW_W * box[3] / box[2] : SHOW_W * item.H / item.W);
    // 点和线按屏幕大小画：放大后跟着缩小，不盖住五官
    const k = zoomed ? box[2] / item.W : 1;
    for (const el of g.querySelectorAll('[data-r]')) el.setAttribute('r', el.dataset.r * k);
    for (const el of g.querySelectorAll('[data-w]')) el.setAttribute('stroke-width', el.dataset.w * k);
    for (const el of g.querySelectorAll('text')) el.style.fontSize = `${13 * k * item.W / SHOW_W}px`;
  });
  div.appendChild(svg);
  if (withTruth && Object.keys(errs).length) {
    const cols = run === '' ? [0, 1, 2] : [Number(run)];
    const head = `<tr><td></td>${cols.map((i) => `<td style="color:${RUN_COLORS[i]}">第 ${i + 1} 次</td>`).join('')}</tr>`;
    const rows = Object.entries(errs).map(([name, v]) => `<tr><td>${name}</td>${cols.map((i) => (v[i] == null ? '<td>-</td>' : `<td class="${v[i] > 3 ? 'bad' : ''}">${v[i].toFixed(1)}%</td>`)).join('')}</tr>`).join('');
    div.insertAdjacentHTML('beforeend', `<table>${head}${rows}</table>`);
  }
  return div;
}

function render() {
  const src = $('src').value, view = $('view').value;
  const main = $('main');
  main.replaceChildren(...data[view].map((item) => card(item, src, view === 'cases')));
}

fetch('data.json').then((r) => r.json()).then((d) => {
  data = d;
  $('truthDefs').innerHTML = Object.entries(TRUTH_DEFS).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')
    + '<dt>误差的尺子</dt><dd>左眼白最左端到右眼白最右端的距离（两眼外沿宽）</dd>';
  $('pointDefs').innerHTML = Object.entries(d.pointDefs ?? {}).map(([k, v]) => `<dt>${TRUTH_DEFS[k] ? '★ ' : ''}${k}</dt><dd>${v}</dd>`).join('');
  $('src').append(...d.sources.map((s) => new Option(s, s)));
  const names = new Set();
  for (const item of [...d.cases, ...d.masters]) {
    for (const k of Object.keys(item.truth ?? {})) names.add(k);
    for (const runs of Object.values(item.points)) for (const p of runs) for (const k of Object.keys(p ?? {})) names.add(k);
  }
  $('only').append(...[...names].sort().map((n) => new Option(n, n)));
  for (const id of ['src', 'view', 'run', 'labels', 'only']) $(id).addEventListener('change', render);
  render();
});
</script>
</body>
</html>
